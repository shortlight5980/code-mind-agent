# CodeMind Agent Configuration

chroma:
  persist_dir: "./chroma_db"
  chunk_size:
    doc: 800
    code: 2000
  chunk_overlap: 100
  retrieval_k:
    docs: 5
    codes: 10

bm25:
  persist_path: "./bm25_index/index.pkl"
  retrieval_k:
    docs: 10
    codes: 20

retrieval:
  mode: "hybrid"  # vector / bm25 / hybrid
  fusion: "rrf"
  rrf_k: 60
  identifier_boost: 0.01

# 被索引的代码仓库路径（用于 Agent 工具查找文件）
repo:
  path: "D:/LJW/projects/FastGPT"

embeddings:
  model: "text-embedding-v1"

llm:
  model: "qwen-max-0919"
  temperature: 0.1

summarizer:
  model: "qwen-turbo"
  temperature: 0.1

query_rewriting:
  model: "qwen-turbo"

splitting:
  max_class_length: 3000  # Classes longer than this will be split

agent:
  enabled: true
  model: "qwen-max-0919"
  temperature: 0.1
  allowed_dirs:
    - "."
  blocked_files:
    - ".env"
    - "*.key"
    - "*.pem"
    - "*.p12"
    - "id_rsa"
  allowed_commands:
    - "ls"
    - "cat"
    - "grep"
    - "git"
    - "find"
    - "head"
    - "tail"
    - "wc"
  command_timeout: 5
  max_search_results: 50

mcp:
  transport: "stdio"  # stdio / local
  server_command:
    - "conda"
    - "run"
    - "--no-capture-output"
    - "-n"
    - "AIP312"
    - "python"
    - "C:/Users/14144/Desktop/CodeMind/CodeMindAgent/codemind_mcp/server.py"
  call_timeout: 10
  startup_timeout: 15
