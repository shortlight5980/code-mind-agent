# CodeMind Agent Configuration

chroma:
  persist_dir: "./chroma_db"
  chunk_size: 800
  chunk_overlap: 100
  retrieval_k: 20

# 被索引的代码仓库路径（用于 Agent 工具查找文件）
repo:
  path: "C:/Users/14144/Desktop/CodeMind/CodeMindAgent"

embeddings:
  model: "text-embedding-v4"

llm:
  model: "qwen-max"
  temperature: 0.1

summarizer:
  model: "qwen-turbo"
  temperature: 0.1

splitting:
  max_class_length: 3000  # Classes longer than this will be split

agent:
  enabled: true
  model: "qwen-max"
  temperature: 0.1
  allowed_dirs:
    - "."
  blocked_files:
    - ".env"
    - "*.key"
    - "*.pem"
    - "*.p12"
    - "id_rsa"
  allowed_commands:
    - "ls"
    - "cat"
    - "grep"
    - "git"
    - "find"
    - "head"
    - "tail"
    - "wc"
  command_timeout: 5
  max_search_results: 50
